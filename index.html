<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Conversor de Moedas Simples</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <div class="card">
        <h1>Conversor de Moedas</h1>

        <div class="field">
          <label for="amount">Valor</label>
          <input id="amount" type="number" value="100" min="0" step="0.01" />
        </div>

        <div class="row">
          <div class="field">
            <label for="fromCurrency">De</label>
            <select id="fromCurrency"></select>
          </div>

          <button id="swapBtn" class="swap-btn" type="button">⇅</button>

          <div class="field">
            <label for="toCurrency">Para</label>
            <select id="toCurrency"></select>
          </div>
        </div>

        <button id="convertBtn" class="convert-btn" type="button">Converter</button>

        <div class="result-box">
          <span>Resultado</span>
          <strong id="result">R$ 0,00</strong>
          <small id="rateInfo">1 BRL = 1 BRL</small>
        </div>
      </div>
    </main>

    <script src="script.js"></script>
  </body>
</html>
